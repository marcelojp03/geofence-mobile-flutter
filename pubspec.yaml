name: geofence_mobile_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP Client
  dio: ^5.7.0

  # Device Info
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.3.3

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Firebase (para notificaciones)
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Maps (descomenta el que vayas a usar)
  # google_maps_flutter: ^2.9.0
  # flutter_map: ^7.0.2

  # Background Service (para implementar más adelante)
  # workmanager: ^0.5.2
  # flutter_background_service: ^5.0.10

  # Theme & Fonts
  flex_color_scheme: ^8.0.2
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

